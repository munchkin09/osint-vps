{
  "device.node_id": "cto-opencanary-01",
  "ip.ignorelist": [],
  "logtype.ignorelist": [],
  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": {
          "format": "%(message)s"
        }
      },
      "handlers": {
        "file": {
          "class": "logging.FileHandler",
          "filename": "/var/tmp/opencanary.log",
          "formatter": "plain"
        }
      }
    }
  },
  "ftp.enabled": true,
  "ftp.port": 21,
  "http.enabled": true,
  "http.port": 80,
  "http.skin": "nasLogin",
  "mysql.enabled": true,
  "mysql.port": 3306,
  "redis.enabled": true,
  "redis.port": 6379,
  "ssh.enabled": false,
  "telnet.enabled": false,
  "smb.enabled": false,
  "mssql.enabled": false,
  "rdp.enabled": false,
  "vnc.enabled": false
}
